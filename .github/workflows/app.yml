# App CI: lint + typecheck + unit tests for the Expo app.
name: app

on:
  push:
    branches: [main]
    paths: ['virtumetry/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['virtumetry/**', '.github/workflows/app.yml']

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtumetry
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: virtumetry/package-lock.json

      - run: npm ci
      # expo-env.d.ts is gitignored (generated by `expo start`); tsc needs it.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npx jest --ci
