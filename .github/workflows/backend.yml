# Backend CI: typecheck + unit tests (Node only).
# Integration suites (test/integration/*.pg.test.ts) run when the
# TEST_DATABASE_URL secret (Neon dev DIRECT host) is set; skip otherwise.
name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'Dockerfile', '.dockerignore', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'Dockerfile', '.dockerignore', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
